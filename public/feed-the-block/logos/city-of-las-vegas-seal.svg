<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Top text: CITY OF LAS VEGAS -->
  <defs>
    <path id="topArc" d="M 55,200 a 145,145 0 0,1 290,0"/>
    <path id="bottomArc" d="M 345,200 a 145,145 0 0,1 -290,0"/>
  </defs>
  <text font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="28" fill="#fff" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CITY OF LAS VEGAS</textPath>
  </text>
  <text font-family="'Times New Roman', Georgia, serif" font-weight="700" font-size="30" fill="#fff" letter-spacing="8">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">NEVADA</textPath>
  </text>

  <!-- Stars separating top/bottom text -->
  <circle cx="68" cy="232" r="4" fill="#fff"/>
  <circle cx="332" cy="232" r="4" fill="#fff"/>

  <!-- Inner circle -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Cityscape silhouette -->
  <g fill="#fff" opacity="0.9">
    <!-- Ground line -->
    <rect x="95" y="265" width="210" height="2" rx="1"/>

    <!-- Left mountain/building cluster -->
    <polygon points="100,265 115,220 125,195 135,210 145,200 155,215 160,265"/>

    <!-- Tall center tower (Stratosphere-like) -->
    <rect x="172" y="130" width="6" height="135"/>
    <rect x="168" y="125" width="14" height="10" rx="2"/>
    <rect x="165" y="150" width="20" height="6" rx="1"/>

    <!-- Center building cluster -->
    <rect x="185" y="175" width="18" height="90" rx="1"/>
    <rect x="188" y="170" width="12" height="5"/>
    <!-- Windows -->
    <rect x="189" y="185" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="196" y="185" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="189" y="197" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="196" y="197" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="189" y="209" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="196" y="209" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="189" y="221" width="4" height="5" rx="0.5" opacity="0.4"/>
    <rect x="196" y="221" width="4" height="5" rx="0.5" opacity="0.4"/>

    <!-- Right building -->
    <rect x="210" y="195" width="16" height="70" rx="1"/>
    <rect x="212" y="200" width="3" height="4" rx="0.5" opacity="0.4"/>
    <rect x="218" y="200" width="3" height="4" rx="0.5" opacity="0.4"/>
    <rect x="212" y="210" width="3" height="4" rx="0.5" opacity="0.4"/>
    <rect x="218" y="210" width="3" height="4" rx="0.5" opacity="0.4"/>
    <rect x="212" y="220" width="3" height="4" rx="0.5" opacity="0.4"/>
    <rect x="218" y="220" width="3" height="4" rx="0.5" opacity="0.4"/>

    <!-- Stepped building -->
    <polygon points="232,265 232,220 240,220 240,205 250,205 250,220 258,220 258,265"/>
  </g>

  <!-- Sun with rays (right side) -->
  <g stroke="#fff" fill="none" stroke-width="1.8">
    <circle cx="270" cy="180" r="12" fill="#fff" stroke="none" opacity="0.9"/>
    <!-- Rays -->
    <line x1="270" y1="162" x2="270" y2="154"/>
    <line x1="283" y1="167" x2="289" y2="161"/>
    <line x1="288" y1="180" x2="296" y2="180"/>
    <line x1="283" y1="193" x2="289" y2="199"/>
    <line x1="270" y1="198" x2="270" y2="206"/>
    <line x1="257" y1="193" x2="251" y2="199"/>
    <line x1="252" y1="180" x2="244" y2="180"/>
    <line x1="257" y1="167" x2="251" y2="161"/>
  </g>

  <!-- Palm trees (right side) -->
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <!-- Trunk -->
    <path d="M290,265 Q288,240 292,220" fill="none"/>
    <!-- Fronds -->
    <path d="M292,220 Q280,210 270,215" fill="none"/>
    <path d="M292,220 Q300,208 310,212" fill="none"/>
    <path d="M292,220 Q285,205 278,208" fill="none"/>
    <path d="M292,220 Q298,205 305,206" fill="none"/>
    <path d="M292,220 Q290,205 290,200" fill="none"/>
  </g>

  <!-- Bird silhouette (upper left) -->
  <path d="M120,155 Q128,148 136,155" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
